server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 10m;

    location = / {
        return 302 /public/index.php;
    }

    # The original app keeps browser pages and form handlers in separate
    # folders. Only PHP files in those two folders are executable.
    location ~ ^/(public|src)/.+\.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location /public/ {
        try_files $uri =404;
    }

    location /resources/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Database, uploads, configuration, and test helpers should never be
    # served directly by the web server.
    location ~ ^/(config|db|uploads|extras|test)/ {
        return 404;
    }

    location / {
        return 404;
    }
}
