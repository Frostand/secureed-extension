services:
  php:
    container_name: secureed-php
    build: .
    volumes:
      - ./app/SecureEd-1.0-master/app/:/var/www/html/

  web:
    container_name: secureed-web
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - ./app/SecureEd-1.0-master/app/:/var/www/html/:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  site:
    container_name: secureed-project-site
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./site/:/usr/share/nginx/html/:ro
